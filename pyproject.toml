[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-admin"
version = "0.1.0"
description = "Standalone admin dashboard for AI Company"
requires-python = ">=3.11"
dependencies = [
  'tomli; python_version < "3.11"',
]

[project.scripts]
ai-company-admin = "ai_company_admin.server:main"

[tool.setuptools.packages.find]
where = ["."]
